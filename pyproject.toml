[build-system]
requires = [
    "setuptools>=42",
    "setuptools_scm[toml]>=3.4.3",
    "wheel",
]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
write_to = "gwmemory/_version.py"

[project]
name = "gwmemory"
authors = [
    {name = "Colm Talbot", email = "colm.talbot@ligo.org"},
]
description = "Calculate the gravitational-wave memory for arbitrary time series"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dynamic = ["version"]

dependencies = [
    "numpy",
    "scipy",
    "sympy",
]

[project.optional-dependencies]
dev = [
    "numba",
]
full = [
    "gwsurrogate",
    "lalsuite",
    "nrsur7dq2",
    "pytest",
    "pytest-cov",
    "sxs",
]
docs = [
    "basemap>=1.3.6",
    "ipykernel",
    "ipython",
    "ipython_genutils",
    "jinja2",
    "nbsphinx",
    "numpydoc",
    "pandoc",
    "pygments",
    "sphinx",
    "sphinx_rtd_theme",
]

[tool.uv.extra-build-dependencies]
nrsur7dq2 = ["numpy"]
